[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bert-tasks"
version = "0.1.0"
description = "Rule-first Chinese intent recognition and command parsing for robot edge scenarios."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = [
  "accelerate>=0.26",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "transformers>=4.38",
  "openai>=2.0",
]
service = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "uvicorn>=0.27",
]
dev = [
  "pytest>=8.0",
]
all = [
  "accelerate>=0.26",
  "fastapi>=0.110",
  "numpy>=1.24",
  "pydantic>=2.0",
  "pytest>=8.0",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "transformers>=4.38",
  "uvicorn>=0.27",
  "openai>=2.0",
]

[project.scripts]
bert-tasks-generate-data = "bert_tasks.data_synthesis:main"
bert-tasks-parse = "bert_tasks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
